name: 3D ENA CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ena3d-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RENV_CONFIG_AUTO_SNAPSHOT: "FALSE"
  RENV_CONFIG_SANDBOX_ENABLED: "FALSE"
  RENV_PATHS_LIBRARY: "${{ github.workspace }}/renv/library"
  R_LIBS: "${{ github.workspace }}/renv/library"
  R_KEEP_PKG_SOURCE: "yes"

jobs:
  app-tests:
    name: R checks, health and browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install R system dependencies
        run: |
          set -euo pipefail
          apt_network_options=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=20
            -o Acquire::https::Timeout=20
            -o Acquire::ForceIPv4=true
            -o DPkg::Lock::Timeout=30
            -o Dpkg::Use-Pty=0
          )
          apt_update_with_retry() {
            local attempt
            for attempt in 1 2 3; do
              if sudo timeout --signal=TERM --kill-after=30s 120s \
                env DEBIAN_FRONTEND=noninteractive \
                apt-get "${apt_network_options[@]}" update; then
                return 0
              fi
              if [ "$attempt" -eq 3 ]; then
                return 1
              fi
              sleep "$((attempt * 5))"
            done
          }
          apt_update_with_retry
          sudo timeout --signal=TERM --kill-after=30s 600s \
            env DEBIAN_FRONTEND=noninteractive \
            apt-get "${apt_network_options[@]}" \
            install --yes --no-install-recommends \
            gfortran \
            libcurl4-openssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libfribidi-dev \
            libharfbuzz-dev \
            libjpeg-dev \
            libpng-dev \
            libssl-dev \
            libtiff-dev \
            libxml2-dev

      - name: Set up exact R version
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.1"
          use-public-rspm: true

      - name: Restore the locked project library
        run: Rscript renv/bootstrap.R

      - name: Verify R version and run unit/integration checks
        run: |
          Rscript -e 'expected <- normalizePath("renv/library"); stopifnot(identical(as.character(getRversion()), "4.4.1"), identical(normalizePath(.libPaths()[[1L]]), expected)); required <- c("shiny", "plotly", "data.table", "R6", "rENA", "bslib", "scales", "digest", "jsonlite", "zip", "testthat"); stopifnot(all(vapply(required, requireNamespace, logical(1), quietly = TRUE)))'
          Rscript tests/check.R

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start Shiny and verify health endpoint
        env:
          E2E_PORT: "3838"
          ENA3D_BUILD_ID: health-${{ github.sha }}
        run: |
          mkdir -p output/playwright
          Rscript tests/e2e/start-app.R >output/playwright/shiny-health.log 2>&1 &
          app_pid=$!
          cleanup() {
            kill "$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          health_ok=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 5 \
              http://127.0.0.1:3838/ena3d-health/healthz.json >/dev/null; then
              health_ok=1
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat output/playwright/shiny-health.log
              exit 1
            fi
            sleep 1
          done
          if [ "$health_ok" -ne 1 ]; then
            cat output/playwright/shiny-health.log
            exit 1
          fi
          curl --fail --silent --show-error --max-time 5 \
            http://127.0.0.1:3838/ena3d-health/healthz.json | \
            Rscript -e 'payload <- jsonlite::fromJSON(paste(readLines(file("stdin")), collapse = "")); stopifnot(identical(payload$status, "ok"))'

      - name: Run fast Chromium browser smoke
        env:
          E2E_PORT: "3838"
          ENA3D_BUILD_ID: e2e-${{ github.sha }}
        run: npm run test:e2e:chromium

  docker-build:
    name: Validate production Docker build
    needs: app-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            ENA3D_BUILD_ID=${{ github.sha }}
            ENA3D_APP_VERSION=ci
          push: false
          load: true
          tags: ena3d:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run hardened image and verify container health metadata
        env:
          TEST_BUILD_ID: ${{ github.sha }}
        run: |
          docker run --detach \
            --name ena3d-ci \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=256m,uid=10001,gid=10001 \
            --tmpfs /home/ena3d:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 256 \
            --memory 2g \
            --cpus 2 \
            --env ENA3D_BUILD_ID="$TEST_BUILD_ID" \
            --env ENA3D_APP_VERSION=ci \
            --publish 127.0.0.1:3838:3838 \
            ena3d:ci
          cleanup() {
            docker inspect --format 'ena3d-ci state={{json .State}}' \
              ena3d-ci 2>/dev/null || true
            docker logs ena3d-ci 2>/dev/null || true
            docker rm --force ena3d-ci >/dev/null 2>&1 || true
            rm -f /tmp/ena3d-health.json
          }
          trap cleanup EXIT
          health_ok=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 5 \
              http://127.0.0.1:3838/ena3d-health/healthz.json \
              --output /tmp/ena3d-health.json; then
              health_ok=1
              break
            fi
            if ! docker inspect --format '{{.State.Running}}' ena3d-ci | grep -qx true; then
              docker inspect --format 'ena3d-ci state={{json .State}}' ena3d-ci
              exit 1
            fi
            sleep 1
          done
          test "$health_ok" -eq 1
          python3 - <<'PY'
          import json
          import os

          with open("/tmp/ena3d-health.json", encoding="utf-8") as health_file:
              health = json.load(health_file)

          assert health["status"] == "ok", health
          assert health["app"] == "3D ENA", health
          assert health["version"] == "ci", health
          assert health["build"] == os.environ["TEST_BUILD_ID"], health
          PY

  vercel-preview-build:
    name: Validate Vercel preview Docker build
    needs: app-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the Vercel preview image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.vercel
          build-args: |
            ENA3D_BUILD_ID=${{ github.sha }}
            ENA3D_APP_VERSION=ci
          push: false
          load: true
          tags: ena3d-vercel:ci
          cache-from: type=gha,scope=vercel-preview
          cache-to: type=gha,mode=max,scope=vercel-preview

      - name: Verify the real prebuilt static and stateful documents
        env:
          TEST_BUILD_ID: ${{ github.sha }}
        run: |
          docker run --detach \
            --name ena3d-vercel-ci \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=256m,uid=10001,gid=10001 \
            --tmpfs /home/ena3d:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 256 \
            --memory 2g \
            --cpus 2 \
            --env VERCEL_GIT_COMMIT_SHA="$TEST_BUILD_ID" \
            --publish 127.0.0.1:3839:80 \
            ena3d-vercel:ci
          cleanup() {
            docker inspect --format 'ena3d-vercel-ci state={{json .State}}' \
              ena3d-vercel-ci 2>/dev/null || true
            docker logs ena3d-vercel-ci 2>/dev/null || true
            docker rm --force ena3d-vercel-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          health_file=$(mktemp)
          health_ok=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 5 \
              http://127.0.0.1:3839/ena3d-health/healthz.json \
              --output "$health_file"; then
              health_ok=1
              break
            fi
            if ! docker inspect --format '{{.State.Running}}' \
              ena3d-vercel-ci | grep -qx true; then
              docker inspect --format \
                'ena3d-vercel-ci state={{json .State}}' ena3d-vercel-ci
              exit 1
            fi
            sleep 1
          done
          test "$health_ok" -eq 1

          for route in / /papers /team /about; do
            static_file=$(mktemp)
            curl --fail --silent --show-error --max-time 10 \
              "http://127.0.0.1:3839${route}" --output "$static_file"
            grep -Fq 'data-site-mode="static"' "$static_file"
            if grep -Fq 'shiny-javascript' "$static_file" || \
                grep -Fq 'ena3d-connection-guard' "$static_file"; then
              echo "Static route unexpectedly contains Shiny session assets: $route" >&2
              exit 1
            fi
          done

          app_file=$(mktemp)
          curl --fail --silent --show-error --max-time 10 \
            http://127.0.0.1:3839/app --output "$app_file"
          grep -Fq 'shiny-javascript' "$app_file"
          grep -Fq 'ena3d-connection-guard' "$app_file"

          internal_app_file=$(mktemp)
          curl --fail --silent --show-error --max-time 10 \
            http://127.0.0.1:3839/__ena3d-app --output "$internal_app_file"
          grep -Fq 'shiny-javascript' "$internal_app_file"
          grep -Fq 'ena3d-connection-guard' "$internal_app_file"

          python3 - "$health_file" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], encoding="utf-8") as health_handle:
              health = json.load(health_handle)

          assert health["status"] == "ok", health
          assert health["app"] == "3D ENA", health
          assert health["version"] == "ci", health
          assert health["build"] == os.environ["TEST_BUILD_ID"], health
          assert health["runtime_profile"] == "ephemeral-preview", health
          assert health["connection_policy"] == "reload-required", health
          PY
