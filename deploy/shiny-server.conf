# 3D ENA must run behind the reviewed TLS reverse proxy. Shiny Server's
# robust transport is the only automatic recovery path enabled here: it
# reattaches the browser to the existing R session for a bounded interval.
run_as ena3d;
socket_dir /tmp/ena3d/sockets;
bookmark_state_dir /tmp/ena3d/bookmarks;
preserve_logs false;

server {
  listen 3838;

  location / {
    app_dir /opt/ena3d/R;
    log_dir /tmp/ena3d/logs;
    log_as_user true;
    log_file_mode 0600;

    # Keep an otherwise empty worker warm beyond the 15-second robust
    # reconnect window, then allow Shiny Server to reclaim it.
    app_idle_timeout 60;
    reconnect true;
    sanitize_errors true;
  }
}
